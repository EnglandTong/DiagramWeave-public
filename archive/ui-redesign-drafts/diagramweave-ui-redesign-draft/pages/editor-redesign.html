<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiagramWeave — 编辑器</title>
    <style id="theme-vars">
/* Source: structured-spec */
/* Brand profile: google / dashboard / clean / analytical / modern */
/* Theme mode: light-dark */
/* Alias layer: enabled */

/* Light mode source tokens */
:root {
  /* Core surface colors */
  --background: #ffffff;
  --foreground: #0e1115;
  --card: #ffffff;
  --card-foreground: #0e1115;
  --popover: #f9f9fa;
  --popover-foreground: #0e1115;

  /* Semantic action colors */
  --primary: #4285f4;
  --primary-foreground: #ffffff;
  --secondary: #dbeafe;
  --secondary-foreground: #333942;
  --muted: #eff1f4;
  --muted-foreground: #7f8d9f;
  --accent: #dbeafe;
  --accent-foreground: #003e8f;
  --destructive: #ef4444;
  --destructive-foreground: #ffffff;

  /* Borders, inputs, focus */
  --border: #ebebeb;
  --input: #e2e3e4;
  --ring: #4285f4;

  /* Data visualization */
  --chart-1: #4285f4;
  --chart-2: #ea4335;
  --chart-3: #fbbc05;
  --chart-4: #0043ad;
  --chart-5: #34a853;

  /* Sidebar */
  --sidebar: #f0f6ff;
  --sidebar-foreground: #0e1115;
  --sidebar-primary: #4285f4;
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #dbeafe;
  --sidebar-accent-foreground: #003e8f;
  --sidebar-border: #e7eaef;
  --sidebar-ring: #4285f4;

  /* Typography */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;

  /* Radius */
  --radius: 0.5rem;

  /* Shadow primitives */
  --shadow-x: 0;
  --shadow-y: 3px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #0e1115;

  /* Elevation */
  --shadow-2xs: 0 3px 0px 0px rgba(14, 17, 21, 0);
  --shadow-xs: 0 3px 0px 0px rgba(14, 17, 21, 0);
  --shadow-sm: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 1px 2px -1px rgba(14, 17, 21, 0);
  --shadow: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 1px 2px -1px rgba(14, 17, 21, 0);
  --shadow-md: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 2px 4px -1px rgba(14, 17, 21, 0);
  --shadow-lg: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 4px 6px -1px rgba(14, 17, 21, 0);
  --shadow-xl: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 8px 10px -1px rgba(14, 17, 21, 0);
  --shadow-2xl: 0 3px 0px 0px rgba(14, 17, 21, 0);

  /* Rhythm */
  --tracking-normal: 0em;
  --spacing: 0.24rem;
}

/* Dark mode source tokens */
.dark {
  /* Core surface colors */
  --background: #161616;
  --foreground: #eff1f4;
  --card: #1d1d1c;
  --card-foreground: #eff1f4;
  --popover: #2e2e2e;
  --popover-foreground: #e5e5e5;

  /* Semantic action colors */
  --primary: #fc2c50;
  --primary-foreground: #ffffff;
  --secondary: #383838;
  --secondary-foreground: #e5e5e5;
  --muted: #383838;
  --muted-foreground: #949494;
  --accent: #4a2026;
  --accent-foreground: #fc2c50;
  --destructive: #ef4444;
  --destructive-foreground: #ffffff;

  /* Borders, inputs, focus */
  --border: #1d1d1c;
  --input: #000000;
  --ring: #ffffff;

  /* Data visualization */
  --chart-1: #2dccd3;
  --chart-2: #f1204a;
  --chart-3: #edbbe8;
  --chart-4: #fbeb35;
  --chart-5: #baf6f0;

  /* Sidebar */
  --sidebar: #171717;
  --sidebar-foreground: #e5e5e5;
  --sidebar-primary: #0065fd;
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #00266b;
  --sidebar-accent-foreground: #bfdbfe;
  --sidebar-border: #404040;
  --sidebar-ring: #00266b;

  /* Typography */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;

  /* Radius */
  --radius: 0.5rem;

  /* Shadow primitives */
  --shadow-x: 0;
  --shadow-y: 3px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #000000;

  /* Elevation */
  --shadow-2xs: 0 3px 0px 0px rgba(0, 0, 0, 0);
  --shadow-xs: 0 3px 0px 0px rgba(0, 0, 0, 0);
  --shadow-sm: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow-md: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 2px 4px -1px rgba(0, 0, 0, 0);
  --shadow-lg: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 4px 6px -1px rgba(0, 0, 0, 0);
  --shadow-xl: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 8px 10px -1px rgba(0, 0, 0, 0);
  --shadow-2xl: 0 3px 0px 0px rgba(0, 0, 0, 0);
}

/* Alias layer */
@theme inline {
  /* Color aliases */
  --google-color-background: var(--background);
  --google-color-foreground: var(--foreground);
  --google-color-card: var(--card);
  --google-color-card-foreground: var(--card-foreground);
  --google-color-popover: var(--popover);
  --google-color-popover-foreground: var(--popover-foreground);
  --google-color-primary: var(--primary);
  --google-color-primary-foreground: var(--primary-foreground);
  --google-color-secondary: var(--secondary);
  --google-color-secondary-foreground: var(--secondary-foreground);
  --google-color-muted: var(--muted);
  --google-color-muted-foreground: var(--muted-foreground);
  --google-color-accent: var(--accent);
  --google-color-accent-foreground: var(--accent-foreground);
  --google-color-destructive: var(--destructive);
  --google-color-destructive-foreground: var(--destructive-foreground);
  --google-color-border: var(--border);
  --google-color-input: var(--input);
  --google-color-ring: var(--ring);
  --google-color-chart-1: var(--chart-1);
  --google-color-chart-2: var(--chart-2);
  --google-color-chart-3: var(--chart-3);
  --google-color-chart-4: var(--chart-4);
  --google-color-chart-5: var(--chart-5);
  --google-color-sidebar: var(--sidebar);
  --google-color-sidebar-foreground: var(--sidebar-foreground);
  --google-color-sidebar-primary: var(--sidebar-primary);
  --google-color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --google-color-sidebar-accent: var(--sidebar-accent);
  --google-color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --google-color-sidebar-border: var(--sidebar-border);
  --google-color-sidebar-ring: var(--sidebar-ring);

  /* Typography aliases */
  --google-font-sans: var(--font-sans);
  --google-font-serif: var(--font-serif);
  --google-font-mono: var(--font-mono);

  /* Radius aliases */
  --google-radius: var(--radius);
  --google-radius-sm: calc(var(--radius) - 4px);
  --google-radius-md: calc(var(--radius) - 2px);
  --google-radius-lg: var(--radius);
  --google-radius-xl: calc(var(--radius) + 4px);

  /* Shadow aliases */
  --google-shadow-x: var(--shadow-x);
  --google-shadow-y: var(--shadow-y);
  --google-shadow-blur: var(--shadow-blur);
  --google-shadow-spread: var(--shadow-spread);
  --google-shadow-opacity: var(--shadow-opacity);
  --google-shadow-color: var(--shadow-color);
  --google-shadow-2xs: var(--shadow-2xs);
  --google-shadow-xs: var(--shadow-xs);
  --google-shadow-sm: var(--shadow-sm);
  --google-shadow: var(--shadow);
  --google-shadow-md: var(--shadow-md);
  --google-shadow-lg: var(--shadow-lg);
  --google-shadow-xl: var(--shadow-xl);
  --google-shadow-2xl: var(--shadow-2xl);

  /* Rhythm aliases */
  --google-tracking-normal: var(--tracking-normal);
  --google-spacing: var(--spacing);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  
  @layer base {
    body { background: var(--google-background); color: var(--google-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <div class="editor-shell">

    <!-- ========== TOOLBAR ========== -->
    <header class="toolbar">
      <!-- Brand -->
      <div class="brand-mark">DW</div>
      <span class="brand-name">DiagramWeave</span>

      <div class="tool-divider"></div>

      <!-- File group -->
      <div class="tool-group">
        <button class="tool-btn" title="新建"><i data-lucide="file-plus"></i></button>
        <button class="tool-btn" title="保存"><i data-lucide="save"></i></button>
        <button class="tool-btn" title="导入"><i data-lucide="upload"></i></button>
        <button class="tool-btn" title="导出"><i data-lucide="download"></i></button>
      </div>

      <div class="tool-divider"></div>

      <!-- Edit group -->
      <div class="tool-group">
        <button class="tool-btn active" title="选择"><i data-lucide="mouse-pointer-2"></i></button>
        <button class="tool-btn" title="连线"><i data-lucide="spline"></i></button>
        <button class="tool-btn" title="平移"><i data-lucide="hand"></i></button>
      </div>

      <div class="tool-divider"></div>

      <!-- Undo/Redo -->
      <div class="tool-group">
        <button class="tool-btn" title="撤销"><i data-lucide="undo-2"></i></button>
        <button class="tool-btn" title="重做"><i data-lucide="redo-2"></i></button>
      </div>

      <div class="tool-divider"></div>

      <!-- Layout group -->
      <div class="tool-group">
        <button class="tool-btn" title="自动布局"><i data-lucide="layout-grid"></i></button>
        <button class="tool-btn" title="路由模式"><i data-lucide="git-branch"></i></button>
      </div>

      <div class="tool-divider"></div>

      <!-- Danger group -->
      <div class="tool-group">
        <button class="tool-btn danger" title="删除"><i data-lucide="trash-2"></i></button>
        <button class="tool-btn danger" title="清空"><i data-lucide="x-circle"></i></button>
      </div>

      <!-- Spacer -->
      <div class="toolbar-spacer"></div>

      <!-- Project title -->
      <div class="project-title-pill">
        <span>用户注册流程</span>
        <i data-lucide="pencil" style="width:12px;height:12px;"></i>
      </div>

      <!-- Zoom in toolbar -->
      <div class="zoom-pill">
        <button title="缩小"><i data-lucide="minus"></i></button>
        <span class="zoom-value">100%</span>
        <button title="放大"><i data-lucide="plus"></i></button>
      </div>

      <div class="tool-divider"></div>

      <!-- Right end actions -->
      <div class="tool-group">
        <button class="tool-btn" title="语言"><i data-lucide="globe"></i></button>
        <button class="tool-btn" title="设置"><i data-lucide="settings"></i></button>
        <button class="tool-btn" title="演示" style="color: var(--primary);"><i data-lucide="play"></i></button>
      </div>
    </header>

    <!-- ========== LEFT SIDEBAR ========== -->
    <aside class="sidebar">
      <!-- Search -->
      <div class="sidebar-search">
        <div class="search-input-wrap">
          <i data-lucide="search"></i>
          <input type="text" placeholder="搜索图形..." readonly>
        </div>
      </div>

      <!-- Template card -->
      <div class="template-card">
        <div class="tc-icon"><i data-lucide="layout-template"></i></div>
        <div>
          <div class="tc-text">流程模板</div>
          <div class="tc-desc">浏览预设模板快速开始</div>
        </div>
      </div>

      <!-- Basic shapes -->
      <div class="section-header">
        <i data-lucide="shapes"></i>
        <span>基本图形</span>
      </div>
      <div class="shape-grid">
        <div class="shape-card type-blue active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
          <span class="sc-label">矩形</span>
        </div>
        <div class="shape-card type-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="10" rx="5"/></svg>
          <span class="sc-label">圆角矩形</span>
        </div>
        <div class="shape-card type-yellow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/></svg>
          <span class="sc-label">椭圆</span>
        </div>
        <div class="shape-card type-red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12,2 22,12 12,22 2,12"/></svg>
          <span class="sc-label">菱形</span>
        </div>
        <div class="shape-card type-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12,2 22,9 19,21 5,21 2,9"/></svg>
          <span class="sc-label">五边形</span>
        </div>
        <div class="shape-card type-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12,2 20,8 20,16 12,22 4,16 4,8"/></svg>
          <span class="sc-label">六边形</span>
        </div>
        <div class="shape-card type-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          <span class="sc-label">星形</span>
        </div>
        <div class="shape-card type-yellow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l4 8 8 1-6 5 2 9-8-4-8 4 2-9-6-5 8-1z"/></svg>
          <span class="sc-label">平行四边形</span>
        </div>
      </div>

      <!-- Extended shapes -->
      <div class="section-header">
        <i data-lucide="puzzle"></i>
        <span>扩展图形</span>
      </div>
      <div class="shape-grid">
        <div class="shape-card type-red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="8" width="16" height="10" rx="0"/><line x1="4" y1="8" x2="4" y2="4"/><line x1="20" y1="8" x2="20" y2="4"/></svg>
          <span class="sc-label">数据库</span>
        </div>
        <div class="shape-card type-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="10" rx="2"/><line x1="8" y1="7" x2="8" y2="17"/><line x1="16" y1="7" x2="16" y2="17"/></svg>
          <span class="sc-label">文档</span>
        </div>
        <div class="shape-card type-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="12" y1="5" x2="12" y2="19"/></svg>
          <span class="sc-label">卡片</span>
        </div>
        <div class="shape-card type-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16"/></svg>
          <span class="sc-label">泳道</span>
        </div>
        <div class="shape-card type-yellow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="4" width="12" height="16" rx="0"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          <span class="sc-label">容器</span>
        </div>
        <div class="shape-card type-red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="20" cy="18" r="2"/></svg>
          <span class="sc-label">列表</span>
        </div>
      </div>

      <!-- Layers -->
      <div class="section-header">
        <i data-lucide="layers"></i>
        <span>图层</span>
      </div>
      <div class="layer-list">
        <div class="layer-item active">
          <i data-lucide="square" style="color: var(--primary);"></i>
          <span class="layer-name">主流程</span>
          <span class="layer-vis"><i data-lucide="eye"></i></span>
        </div>
        <div class="layer-item">
          <i data-lucide="square" style="color: var(--chart-1);"></i>
          <span class="layer-name">备注层</span>
          <span class="layer-vis"><i data-lucide="eye"></i></span>
        </div>
        <div class="layer-item">
          <i data-lucide="square" style="color: var(--chart-5);"></i>
          <span class="layer-name">辅助线</span>
          <span class="layer-vis"><i data-lucide="eye-off"></i></span>
        </div>
      </div>
    </aside>

    <!-- ========== CANVAS AREA ========== -->
    <main class="canvas-area">
      <!-- Connection lines SVG -->
      <svg class="connections-svg" xmlns="http://www.w3.org/2000/svg">
        <path d="M 320 80 C 320 130, 320 160, 320 210" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.3"/>
        <path d="M 400 250 C 480 250, 500 250, 560 250" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.3"/>
        <path d="M 640 320 C 640 380, 640 400, 640 440" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.3"/>
        <path d="M 580 250 C 500 290, 380 290, 320 280" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.15"/>
      </svg>

      <!-- Nodes -->
      <div class="node node-green" style="left: 240px; top: 50px; width: 140px; height: 50px;">
        <span>开始</span>
      </div>

      <div class="node node-blue selected" style="left: 240px; top: 220px; width: 160px; height: 56px;">
        <span>处理数据</span>
      </div>

      <div class="node node-yellow" style="left: 560px; top: 210px; width: 56px; height: 56px;">
        <span>验证?</span>
      </div>

      <div class="node node-red" style="left: 570px; top: 440px; width: 140px; height: 50px;">
        <span>结束</span>
      </div>

      <!-- Floating minimap -->
      <div class="minimap">
        <div class="minimap-viewport"></div>
        <div class="minimap-dot mg"></div>
        <div class="minimap-dot mb"></div>
        <div class="minimap-dot my"></div>
        <div class="minimap-dot mr"></div>
      </div>

      <!-- Floating zoom pill -->
      <div class="canvas-zoom-pill">
        <button><i data-lucide="minus"></i></button>
        <span class="czp-value">100%</span>
        <div class="czp-divider"></div>
        <button><i data-lucide="maximize-2"></i></button>
        <button><i data-lucide="plus"></i></button>
      </div>
    </main>

    <!-- ========== PROPERTIES PANEL ========== -->
    <aside class="props-panel">
      <div class="props-header">
        <span>属性</span>
        <i data-lucide="x"></i>
      </div>

      <!-- Selected node info -->
      <div class="props-section">
        <div class="props-section-title">选中节点</div>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
          <div style="width:28px;height:28px;border-radius:var(--radius);background:var(--muted);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;">
            <i data-lucide="square" style="width:14px;height:14px;color:var(--chart-1);"></i>
          </div>
          <div>
            <div style="font-size:12px;font-weight:600;color:var(--foreground);">处理数据</div>
            <div style="font-size:10px;color:var(--muted-foreground);">矩形节点</div>
          </div>
        </div>
        <div class="props-field">
          <div class="props-field-label">标签</div>
          <input class="props-field-input" type="text" value="处理数据" readonly>
        </div>
        <div class="props-field-row">
          <div class="props-field">
            <div class="props-field-label">X</div>
            <input class="props-field-input" type="text" value="240" readonly>
          </div>
          <div class="props-field">
            <div class="props-field-label">Y</div>
            <input class="props-field-input" type="text" value="220" readonly>
          </div>
        </div>
        <div class="props-field-row">
          <div class="props-field">
            <div class="props-field-label">W</div>
            <input class="props-field-input" type="text" value="160" readonly>
          </div>
          <div class="props-field">
            <div class="props-field-label">H</div>
            <input class="props-field-input" type="text" value="56" readonly>
          </div>
        </div>
      </div>

      <!-- Style section -->
      <div class="props-section">
        <div class="props-section-title">样式</div>

        <div class="props-field">

            <div class="swatch" style="background:var(--secondary);"></div>
            <div class="swatch" style="background:var(--accent);"></div>
            <div class="swatch" style="background:var(--chart-3);"></div>
            <div class="swatch" style="background:var(--chart-2);"></div>
            <div class="swatch" style="background:var(--card);"></div>

        <div class="props-field">
          <div class="props-field-label">边框颜色</div>
          <div class="color-swatches">
            <div class="swatch" style="background:var(--chart-1);"></div>
            <div class="swatch active" style="background:var(--muted-foreground);"></div>
            <div class="swatch" style="background:var(--primary);"></div>
            <div class="swatch" style="background:var(--chart-5);"></div>
            <div class="swatch" style="background:var(--chart-3);"></div>
            <div class="swatch" style="background:var(--chart-2);"></div>
          </div>

        <div class="props-field">
          <div class="props-field-label">边框宽度</div>

              <div class="slider-thumb" style="left:30%;"></div>

        <div class="props-field">

              <div class="slider-thumb" style="left:100%;"></div>
            </div>
            <span class="slider-value">100%</span>
          </div>

      <!-- Quick actions -->
      <div class="props-section">
        <div class="props-section-title">快捷操作</div>
        <button class="quick-action-btn">
          <i data-lucide="copy"></i>
          复制节点
        </button>
        <button class="quick-action-btn">
          <i data-lucide="lock"></i>
          锁定位置
        </button>
        <button class="quick-action-btn">
          <i data-lucide="palette"></i>
          复制样式
        </button>
        <button class="quick-action-btn danger">
          <i data-lucide="trash-2"></i>

        </button>

    <!-- ========== PAGE TABS BAR ========== -->
    <footer class="tabs-bar">
      <div class="tab-item active">
        <i data-lucide="file-text"></i>
        <span>Page 1</span>

      <div class="tab-item">
        <i data-lucide="file-text"></i>

  <!-- Initialize Lucide icons -->
  <script>
    lucide.createIcons();
  </script>

  <style>
    /* ===== Global Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh;
      overflow: hidden;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Editor Shell (CSS Grid) ===== */
    .editor-shell {
      display: grid;
      grid-template-rows: 48px 1fr 32px;
      grid-template-columns: 260px 1fr 280px;
      grid-template-areas:
        "toolbar toolbar toolbar"
        "sidebar canvas  props"
        "tabs    tabs   tabs";
      height: 100vh;
      width: 100vw;
    }

    /* ===== Toolbar ===== */
    .toolbar {
      grid-area: toolbar;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 4px;
      z-index: 20;
    }

    .brand-mark {
      width: 32px; height: 32px;
      border-radius: var(--radius);
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; color: var(--primary-foreground);
      flex-shrink: 0;
      margin-right: 8px;
    }
    .brand-name {
      font-weight: 600; font-size: 13px; color: var(--foreground);
      margin-right: 16px; white-space: nowrap;
    }

    .tool-divider {
      width: 1px; height: 24px;
      background: var(--border);
      margin: 0 6px;
      flex-shrink: 0;
    }

    .tool-group {
      display: flex; align-items: center; gap: 2px;
    }

    .tool-btn {
      width: 32px; height: 32px;
      border-radius: var(--radius);
      border: none; background: transparent;
      color: var(--muted-foreground);
      display: flex; align-items: center; justify-content: center;
      cursor: default;
      position: relative;
      transition: background 120ms ease, color 120ms ease;
    }
    .tool-btn:hover {
      background: var(--muted);
      color: var(--foreground);
    }
    .tool-btn.active {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    .tool-btn.danger:hover {
      background: var(--destructive);
      color: var(--destructive-foreground);
    }
    .tool-btn svg { width: 16px; height: 16px; }

    .toolbar-spacer { flex: 1; }

    .project-title-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 4px 12px 4px 14px;
      font-size: 12px; font-weight: 500;
      font-family: var(--font-mono);
      color: var(--foreground);
      white-space: nowrap;
    }
    .project-title-pill svg { width: 13px; height: 13px; color: var(--muted-foreground); }

    .zoom-pill {
      display: flex; align-items: center;
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 2px 4px;
      gap: 0;
      margin-left: 8px;
    }
    .zoom-pill button {
      width: 26px; height: 26px;
      border: none; background: transparent;
      color: var(--muted-foreground); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: default; font-size: 14px; font-weight: 600;
    }
    .zoom-pill button:hover { background: var(--secondary); color: var(--foreground); }
    .zoom-pill button svg { width: 14px; height: 14px; }
    .zoom-pill .zoom-value {
      font-size: 11px; font-weight: 500;
      color: var(--muted-foreground); padding: 0 4px;
      font-family: var(--font-mono);
      min-width: 32px; text-align: center;
    }

    /* ===== Left Sidebar ===== */
    .sidebar {
      grid-area: sidebar;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex; flex-direction: column;
      z-index: 10;
    }

    .sidebar-search {
      padding: 10px 12px 8px;
    }
    .sidebar-search .search-input-wrap {
      display: flex; align-items: center; gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
    }
    .sidebar-search .search-input-wrap svg { width: 14px; height: 14px; color: var(--muted-foreground); flex-shrink: 0; }
    .sidebar-search .search-input-wrap input {
      border: none; background: transparent; outline: none;
      font-size: 12px; color: var(--foreground);
      width: 100%; font-family: var(--font-sans);
    }
    .sidebar-search .search-input-wrap input::placeholder { color: var(--muted-foreground); }

    .template-card {
      margin: 0 12px 10px;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex; align-items: center; gap: 10px;
      cursor: default;
      transition: border-color 120ms ease;
    }
    .template-card:hover { border-color: var(--muted-foreground); }
    .template-card .tc-icon {
      width: 36px; height: 36px;
      border-radius: var(--radius);
      background: var(--muted);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary);
    }
    .template-card .tc-icon svg { width: 18px; height: 18px; }
    .template-card .tc-text { font-size: 12px; font-weight: 500; color: var(--foreground); }
    .template-card .tc-desc { font-size: 10px; color: var(--muted-foreground); margin-top: 1px; }

    .section-header {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px 6px;
      font-size: 10px; font-weight: 600;
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .section-header svg { width: 12px; height: 12px; }

    .shape-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 0 12px 10px;
    }

    .shape-card {
      height: 54px;
      border-radius: 4px;
      background: var(--card);
      border: 1px solid transparent;
      border-left: 3px solid var(--border);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
      cursor: default;
      transition: background 120ms ease, border-color 120ms ease;
      position: relative;
    }
    .shape-card:hover {
      background: var(--secondary);
      border-color: var(--border);
    }
    .shape-card.active {
      border-left-color: var(--primary);
      background: var(--muted);
    }
    .shape-card svg { width: 20px; height: 20px; }
    .shape-card .sc-label { font-size: 10px; color: var(--muted-foreground); }
    .shape-card.type-blue   svg { color: var(--chart-1); }
    .shape-card.type-green  svg { color: var(--chart-5); }
    .shape-card.type-yellow svg { color: var(--chart-3); }
    .shape-card.type-red    svg { color: var(--chart-2); }
    .shape-card.type-purple svg { color: var(--primary); }
    .shape-card.type-blue.active   { border-left-color: var(--chart-1); }
    .shape-card.type-green.active  { border-left-color: var(--chart-5); }
    .shape-card.type-yellow.active { border-left-color: var(--chart-3); }
    .shape-card.type-red.active    { border-left-color: var(--chart-2); }
    .shape-card.type-purple.active { border-left-color: var(--primary); }

    .layer-list {
      padding: 0 12px 12px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .layer-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px; color: var(--muted-foreground);
      cursor: default;
      transition: background 120ms ease;
    }
    .layer-item:hover { background: var(--muted); }
    .layer-item.active { background: var(--muted); color: var(--foreground); }
    .layer-item svg { width: 14px; height: 14px; flex-shrink: 0; }
    .layer-item .layer-name { flex: 1; }
    .layer-item .layer-vis svg { width: 13px; height: 13px; }

    /* ===== Canvas Area ===== */
    .canvas-area {
      grid-area: canvas;
      background: var(--background);
      position: relative;
      overflow: hidden;
      background-image:
        radial-gradient(circle, var(--muted-foreground) 0.5px, transparent 0.5px);
      background-size: 20px 20px;
      opacity: 1;
    }

    /* Sample flowchart nodes */
    .node {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 500;
      border-radius: var(--radius);
      border: 1.5px solid;
      cursor: default;
      white-space: nowrap;
      z-index: 5;
    }
    .node-green {
      background: var(--muted);
      border-color: var(--chart-5);
      color: var(--chart-5);
      border-radius: 9999px;
    }
    .node-blue {
      background: var(--muted);
      border-color: var(--chart-1);
      color: var(--chart-1);
    }
    .node-yellow {
      background: var(--muted);
      border-color: var(--chart-3);
      color: var(--chart-3);
      border-radius: 4px;
      transform: rotate(45deg);
    }
    .node-yellow span { transform: rotate(-45deg); }
    .node-red {
      background: var(--muted);
      border-color: var(--chart-2);
      color: var(--chart-2);
      border-radius: 9999px;
    }
    .node.selected {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 2px var(--muted), 0 0 0 4px var(--primary) !important;
    }

    /* Connection lines via SVG */
    .connections-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Floating minimap */
    .minimap {
      position: absolute;
      bottom: 48px; right: 12px;
      width: 160px; height: 120px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      z-index: 15;
      overflow: hidden;
    }
    .minimap-viewport {
      position: absolute;
      border: 1.5px solid var(--primary);
      border-radius: 2px;
      background: var(--muted);
      top: 20px; left: 30px;
      width: 90px; height: 70px;
    }
    .minimap-dot {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .minimap-dot.mg { background: var(--chart-5); top: 25px; left: 45px; }
    .minimap-dot.mb { background: var(--chart-1); top: 45px; left: 70px; }
    .minimap-dot.my { background: var(--chart-3); top: 70px; left: 65px; }
    .minimap-dot.mr { background: var(--chart-2); top: 95px; left: 85px; }

    /* Floating zoom pill */
    .canvas-zoom-pill {
      position: absolute;
      bottom: 48px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 3px;
      z-index: 15;
      gap: 2px;
    }
    .canvas-zoom-pill button {
      width: 28px; height: 28px;
      border: none; background: transparent;
      color: var(--muted-foreground); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: default;
    }
    .canvas-zoom-pill button:hover { background: var(--muted); color: var(--foreground); }
    .canvas-zoom-pill button svg { width: 14px; height: 14px; }
    .canvas-zoom-pill .czp-value {
      font-size: 11px; font-weight: 600;
      color: var(--foreground);
      padding: 0 6px;
      font-family: var(--font-mono);
      min-width: 36px; text-align: center;
    }
    .canvas-zoom-pill .czp-divider {
      width: 1px; height: 18px; background: var(--border);
    }

    /* ===== Properties Panel ===== */
    .props-panel {
      grid-area: props;
      background: var(--card);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      z-index: 10;
      display: flex; flex-direction: column;
    }

    .props-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px; font-weight: 600;
      color: var(--foreground);
    }
    .props-header svg { width: 14px; height: 14px; color: var(--muted-foreground); }

    .props-section {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .props-section:last-child { border-bottom: none; }

    .props-section-title {
      font-size: 10px; font-weight: 600;
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .props-field {
      margin-bottom: 8px;
    }
    .props-field-label {
      font-size: 10px; color: var(--muted-foreground);
      margin-bottom: 3px;
    }
    .props-field-input {
      width: 100%;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 11px;
      color: var(--foreground);
      font-family: var(--font-mono);
      outline: none;
    }
    .props-field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .color-swatches {
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .swatch {
      width: 22px; height: 22px;
      border-radius: 4px;
      border: 1.5px solid var(--border);
      cursor: default;
      position: relative;
      transition: border-color 120ms ease;
    }
    .swatch:hover { border-color: var(--muted-foreground); }
    .swatch.active { border-color: var(--foreground); }
    .swatch.active::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--foreground);
      mix-blend-mode: difference;
    }

    .slider-row {
      display: flex; align-items: center; gap: 8px;
    }
    .slider-track {
      flex: 1; height: 4px;
      background: var(--secondary);
      border-radius: 2px;
      position: relative;
    }
    .slider-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      width: 40%;
    }
    .slider-thumb {
      width: 12px; height: 12px;
      background: var(--foreground);
      border-radius: 50%;
      position: absolute;
      top: 50%; left: 40%;
      transform: translate(-50%, -50%);
    }
    .slider-value {
      font-size: 11px; font-family: var(--font-mono);
      color: var(--muted-foreground); min-width: 28px; text-align: right;
    }

    .quick-action-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%;
      padding: 7px 0;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted-foreground);
      font-size: 11px; font-weight: 500;
      cursor: default;
      margin-bottom: 4px;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }
    .quick-action-btn:hover {
      background: var(--muted);
      color: var(--foreground);
      border-color: var(--muted-foreground);
    }
    .quick-action-btn svg { width: 14px; height: 14px; }
    .quick-action-btn.danger {
      color: var(--destructive);
      border-color: var(--border);
    }
    .quick-action-btn.danger:hover {
      background: var(--destructive);
      color: var(--destructive-foreground);
    }

    /* ===== Page Tabs Bar ===== */
    .tabs-bar {
      grid-area: tabs;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 8px;
      gap: 2px;
      z-index: 20;
    }
    .tab-item {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 14px;
      font-size: 11px; font-weight: 500;
      color: var(--muted-foreground);
      border-radius: 4px 4px 0 0;
      cursor: default;
      position: relative;
      transition: color 120ms ease;
    }
    .tab-item:hover { color: var(--foreground); }
    .tab-item.active {
      color: var(--foreground);
      background: var(--muted);
    }
    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--primary);
      border-radius: 2px 2px 0 0;
    }
    .tab-item svg { width: 12px; height: 12px; }
    .tab-add {
      width: 24px; height: 24px;
      border-radius: 4px;
      border: none; background: transparent;
      color: var(--muted-foreground);
      display: flex; align-items: center; justify-content: center;
      cursor: default;
    }
    .tab-add:hover { background: var(--muted); color: var(--foreground); }
    .tab-add svg { width: 14px; height: 14px; }

    /* ===== Scrollbar ===== */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--muted);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }

    /* [data-icon] mask infrastructure */
    [data-icon] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      background-color: currentColor;
    }

    /* @media (prefers-reduced-motion: reduce) */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</body>

<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiagramWeave — UI 红线设计稿</title>
    <style id="theme-vars">
/* ============================================
   DiagramWeave UI Redesign — Design Concept
   Style: Deep Modern Editor
   Reference: Figma + Excalidraw + Linear Dark
   ============================================ */

:root {
  /* Background system — layered depth */
  --bg-canvas: #0c0e14;
  --bg-base: #111320;
  --bg-surface: #161828;
  --bg-elevated: #1c1f32;
  --bg-hover: #232740;
  --bg-active: #2a2e48;
  --bg-code: #1a1d2e;

  /* Accent — Indigo-Violet gradient identity */
  --accent: #7c6aff;
  --accent-hover: #9488ff;
  --accent-dim: rgba(124, 106, 255, 0.12);
  --accent-glow: rgba(124, 106, 255, 0.25);
  --accent-surface: rgba(124, 106, 255, 0.06);
  --accent-secondary: #38bdf8;
  --accent-secondary-dim: rgba(56, 189, 248, 0.12);

  /* Semantic status */
  --status-success: #34d399;
  --status-success-dim: rgba(52, 211, 153, 0.12);
  --status-warning: #fbbf24;
  --status-warning-dim: rgba(251, 191, 36, 0.12);
  --status-danger: #f87171;
  --status-danger-dim: rgba(248, 113, 113, 0.12);
  --status-info: #60a5fa;
  --status-info-dim: rgba(96, 165, 250, 0.12);

  /* Text tokens */
  --text-primary: #e8eaf2;
  --text-secondary: #9498b4;
  --text-muted: #5e6280;
  --text-on-accent: #ffffff;

  /* Border tokens */
  --border: rgba(255, 255, 255, 0.06);
  --border-hover: rgba(255, 255, 255, 0.12);
  --border-focus: var(--accent);
  --divider: rgba(255, 255, 255, 0.04);

  /* Shadow tokens */
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 20px rgba(124, 106, 255, 0.15);

  /* Radius tokens */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;

  /* Spacing tokens */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* Transition tokens */
  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;
  --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);

  /* Typography */
  --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
  --font-display: 'Inter', system-ui, sans-serif;

  color: var(--text-primary);
  background: var(--bg-base);
  font-family: var(--font-sans);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-bg-canvas: var(--bg-canvas);
    --color-bg-base: var(--bg-base);
    --color-bg-surface: var(--bg-surface);
    --color-bg-elevated: var(--bg-elevated);
    --color-bg-hover: var(--bg-hover);
    --color-bg-active: var(--bg-active);
    --color-accent: var(--accent);
    --color-accent-hover: var(--accent-hover);
    --color-accent-dim: var(--accent-dim);
    --color-text-primary: var(--text-primary);
    --color-text-secondary: var(--text-secondary);
    --color-text-muted: var(--text-muted);
    --color-bg-foreground: var(--text-primary);
    --color-border-theme: var(--border);
    --color-border-hover: var(--border-hover);
    --color-status-success: var(--status-success);
    --color-status-warning: var(--status-warning);
    --color-status-danger: var(--status-danger);
    --color-status-info: var(--status-info);
  }

  @layer base {
    body { background: var(--bg-surface); color: var(--bg-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <div class="editor-shell">

    <!-- ========== TOOLBAR ========== -->
    <header class="toolbar">
      <!-- Brand -->
      <div class="brand-mark">DW</div>
      <span class="brand-name">DiagramWeave</span>

      <div class="tool-divider"></div>

      <!-- File group -->
      <div class="tool-group">
        <button class="tool-btn" title="新建"><i data-lucide="file-plus"></i></button>
        <button class="tool-btn" title="保存"><i data-lucide="save"></i></button>
        <button class="tool-btn" title="导入"><i data-lucide="upload"></i></button>
        <button class="tool-btn" title="导出"><i data-lucide="download"></i></button>
      </div>

      <div class="tool-divider"></div>

      <!-- Edit group -->
      <div class="tool-group">
        <button class="tool-btn active" title="选择"><i data-lucide="mouse-pointer-2"></i></button>
        <button class="tool-btn" title="连线"><i data-lucide="spline"></i></button>
        <button class="tool-btn" title="平移"><i data-lucide="hand"></i></button>
      </div>

      <div class="tool-divider"></div>

      <!-- Undo/Redo -->
      <div class="tool-group">
        <button class="tool-btn" title="撤销"><i data-lucide="undo-2"></i></button>
        <button class="tool-btn" title="重做"><i data-lucide="redo-2"></i></button>
      </div>

      <div class="tool-divider"></div>

      <!-- Layout group -->
      <div class="tool-group">
        <button class="tool-btn" title="自动布局"><i data-lucide="layout-grid"></i></button>
        <button class="tool-btn" title="路由模式"><i data-lucide="git-branch"></i></button>
      </div>

      <div class="tool-divider"></div>

      <!-- Danger group -->
      <div class="tool-group">
        <button class="tool-btn danger" title="删除"><i data-lucide="trash-2"></i></button>
        <button class="tool-btn danger" title="清空"><i data-lucide="x-circle"></i></button>
      </div>

      <!-- Spacer -->
      <div class="toolbar-spacer"></div>

      <!-- Project title -->
      <div class="project-title-pill">
        <span>用户注册流程</span>
        <i data-lucide="pencil" style="width:12px;height:12px;"></i>
      </div>

      <!-- Zoom in toolbar -->
      <div class="zoom-pill">
        <button title="缩小"><i data-lucide="minus"></i></button>
        <span class="zoom-value">100%</span>
        <button title="放大"><i data-lucide="plus"></i></button>
      </div>

      <div class="tool-divider"></div>

      <!-- Right end actions -->
      <div class="tool-group">
        <button class="tool-btn" title="语言"><i data-lucide="globe"></i></button>
        <button class="tool-btn" title="设置"><i data-lucide="settings"></i></button>
        <button class="tool-btn" title="演示" style="color: var(--accent);"><i data-lucide="play"></i></button>
      </div>
    </header>

    <!-- ========== LEFT SIDEBAR ========== -->
    <aside class="sidebar">
      <!-- Search -->
      <div class="sidebar-search">
        <div class="search-input-wrap">
          <i data-lucide="search"></i>
          <input type="text" placeholder="搜索图形..." readonly>
        </div>
      </div>

      <!-- Template card -->
      <div class="template-card">
        <div class="tc-icon"><i data-lucide="layout-template"></i></div>
        <div>
          <div class="tc-text">流程模板</div>
          <div class="tc-desc">浏览预设模板快速开始</div>
        </div>
      </div>

      <!-- Basic shapes -->
      <div class="section-header">
        <i data-lucide="shapes"></i>
        <span>基本图形</span>
      </div>
      <div class="shape-grid">
        <div class="shape-card type-blue active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
          <span class="sc-label">矩形</span>
        </div>
        <div class="shape-card type-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="10" rx="5"/></svg>
          <span class="sc-label">圆角矩形</span>
        </div>
        <div class="shape-card type-yellow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/></svg>
          <span class="sc-label">椭圆</span>
        </div>
        <div class="shape-card type-red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12,2 22,12 12,22 2,12"/></svg>
          <span class="sc-label">菱形</span>
        </div>
        <div class="shape-card type-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12,2 22,9 19,21 5,21 2,9"/></svg>
          <span class="sc-label">五边形</span>
        </div>
        <div class="shape-card type-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12,2 20,8 20,16 12,22 4,16 4,8"/></svg>
          <span class="sc-label">六边形</span>
        </div>
        <div class="shape-card type-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          <span class="sc-label">星形</span>
        </div>
        <div class="shape-card type-yellow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l4 8 8 1-6 5 2 9-8-4-8 4 2-9-6-5 8-1z"/></svg>
          <span class="sc-label">平行四边形</span>
        </div>
      </div>

      <!-- Extended shapes -->
      <div class="section-header">
        <i data-lucide="puzzle"></i>
        <span>扩展图形</span>
      </div>
      <div class="shape-grid">
        <div class="shape-card type-red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="8" width="16" height="10" rx="0"/><line x1="4" y1="8" x2="4" y2="4"/><line x1="20" y1="8" x2="20" y2="4"/></svg>
          <span class="sc-label">数据库</span>
        </div>
        <div class="shape-card type-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="10" rx="2"/><line x1="8" y1="7" x2="8" y2="17"/><line x1="16" y1="7" x2="16" y2="17"/></svg>
          <span class="sc-label">文档</span>
        </div>
        <div class="shape-card type-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="12" y1="5" x2="12" y2="19"/></svg>
          <span class="sc-label">卡片</span>
        </div>
        <div class="shape-card type-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16"/></svg>
          <span class="sc-label">泳道</span>
        </div>
        <div class="shape-card type-yellow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="4" width="12" height="16" rx="0"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          <span class="sc-label">容器</span>
        </div>
        <div class="shape-card type-red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="20" cy="18" r="2"/></svg>
          <span class="sc-label">列表</span>
        </div>
      </div>

      <!-- Layers -->
      <div class="section-header">
        <i data-lucide="layers"></i>
        <span>图层</span>
      </div>
      <div class="layer-list">
        <div class="layer-item active">
          <i data-lucide="square" style="color: var(--accent);"></i>
          <span class="layer-name">主流程</span>
          <span class="layer-vis"><i data-lucide="eye"></i></span>
        </div>
        <div class="layer-item">
          <i data-lucide="square" style="color: var(--status-info);"></i>
          <span class="layer-name">备注层</span>
          <span class="layer-vis"><i data-lucide="eye"></i></span>
        </div>
        <div class="layer-item">
          <i data-lucide="square" style="color: var(--status-success);"></i>
          <span class="layer-name">辅助线</span>
          <span class="layer-vis"><i data-lucide="eye-off"></i></span>
        </div>
      </div>
    </aside>

    <!-- ========== CANVAS AREA ========== -->
    <main class="canvas-area">
      <!-- Connection lines SVG -->
      <svg class="connections-svg" xmlns="http://www.w3.org/2000/svg">
        <!-- Start -> Process -->
        <path d="M 320 80 C 320 130, 320 160, 320 210" fill="none" stroke="rgba(148,152,180,0.3)" stroke-width="1.5" stroke-dasharray="6 3"/>
        <!-- Process -> Decision -->
        <path d="M 400 250 C 480 250, 500 250, 560 250" fill="none" stroke="rgba(148,152,180,0.3)" stroke-width="1.5" stroke-dasharray="6 3"/>
        <!-- Decision -> End -->
        <path d="M 640 320 C 640 380, 640 400, 640 440" fill="none" stroke="rgba(148,152,180,0.3)" stroke-width="1.5" stroke-dasharray="6 3"/>
        <!-- Decision -> Process (loop back) -->
        <path d="M 580 250 C 500 290, 380 290, 320 280" fill="none" stroke="rgba(148,152,180,0.15)" stroke-width="1.5" stroke-dasharray="4 4"/>
      </svg>

      <!-- Nodes -->
      <div class="node node-green" style="left: 240px; top: 50px; width: 140px; height: 50px;">
        <span>开始</span>
      </div>

      <div class="node node-blue selected" style="left: 240px; top: 220px; width: 160px; height: 56px;">
        <span>处理数据</span>
      </div>

      <div class="node node-yellow" style="left: 560px; top: 210px; width: 56px; height: 56px;">
        <span>验证?</span>
      </div>

      <div class="node node-red" style="left: 570px; top: 440px; width: 140px; height: 50px;">
        <span>结束</span>
      </div>

      <!-- Floating minimap -->
      <div class="minimap">
        <div class="minimap-viewport"></div>
        <div class="minimap-dot mg"></div>
        <div class="minimap-dot mb"></div>
        <div class="minimap-dot my"></div>
        <div class="minimap-dot mr"></div>
      </div>

      <!-- Floating zoom pill -->
      <div class="canvas-zoom-pill">
        <button><i data-lucide="minus"></i></button>
        <span class="czp-value">100%</span>
        <div class="czp-divider"></div>
        <button><i data-lucide="maximize-2"></i></button>
        <button><i data-lucide="plus"></i></button>
      </div>
    </main>

    <!-- ========== PROPERTIES PANEL ========== -->
    <aside class="props-panel">
      <div class="props-header">
        <span>属性</span>
        <i data-lucide="x"></i>
      </div>

      <!-- Selected node info -->
      <div class="props-section">
        <div class="props-section-title">选中节点</div>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
          <div style="width:28px;height:28px;border-radius:6px;background:var(--status-info-dim);border:1px solid rgba(96,165,250,0.3);display:flex;align-items:center;justify-content:center;">
            <i data-lucide="square" style="width:14px;height:14px;color:var(--status-info);"></i>
          </div>
          <div>
            <div style="font-size:12px;font-weight:600;color:var(--text-primary);">处理数据</div>
            <div style="font-size:10px;color:var(--text-muted);">矩形节点</div>
          </div>
        </div>
        <div class="props-field">
          <div class="props-field-label">标签</div>
          <input class="props-field-input" type="text" value="处理数据" readonly>
        </div>
        <div class="props-field-row">
          <div class="props-field">
            <div class="props-field-label">X</div>
            <input class="props-field-input" type="text" value="240" readonly>
          </div>
          <div class="props-field">
            <div class="props-field-label">Y</div>
            <input class="props-field-input" type="text" value="220" readonly>
          </div>
        </div>
        <div class="props-field-row">
          <div class="props-field">
            <div class="props-field-label">W</div>
            <input class="props-field-input" type="text" value="160" readonly>
          </div>
          <div class="props-field">
            <div class="props-field-label">H</div>
            <input class="props-field-input" type="text" value="56" readonly>
          </div>
        </div>
      </div>

      <!-- Style section -->
      <div class="props-section">
        <div class="props-section-title">样式</div>

        <div class="props-field">
          <div class="props-field-label">填充颜色</div>
          <div class="color-swatches">
            <div class="swatch active" style="background:rgba(96,165,250,0.2);"></div>
            <div class="swatch" style="background:rgba(124,106,255,0.2);"></div>
            <div class="swatch" style="background:rgba(52,211,153,0.2);"></div>
            <div class="swatch" style="background:rgba(251,191,36,0.2);"></div>
            <div class="swatch" style="background:rgba(248,113,113,0.2);"></div>
            <div class="swatch" style="background:rgba(255,255,255,0.08);"></div>
          </div>
        </div>

        <div class="props-field">
          <div class="props-field-label">边框颜色</div>
          <div class="color-swatches">
            <div class="swatch" style="background:#60a5fa;"></div>
            <div class="swatch active" style="background:rgba(96,165,250,0.5);"></div>
            <div class="swatch" style="background:#7c6aff;"></div>
            <div class="swatch" style="background:#34d399;"></div>
            <div class="swatch" style="background:#fbbf24;"></div>
            <div class="swatch" style="background:#f87171;"></div>
          </div>
        </div>

        <div class="props-field">
          <div class="props-field-label">边框宽度</div>
          <div class="slider-row">
            <div class="slider-track">
              <div class="slider-fill" style="width:30%;"></div>
              <div class="slider-thumb" style="left:30%;"></div>
            </div>
            <span class="slider-value">1.5</span>
          </div>
        </div>

        <div class="props-field">
          <div class="props-field-label">不透明度</div>
          <div class="slider-row">
            <div class="slider-track">
              <div class="slider-fill" style="width:100%; background: var(--accent-secondary);"></div>
              <div class="slider-thumb" style="left:100%;"></div>
            </div>
            <span class="slider-value">100%</span>
          </div>
        </div>
      </div>

      <!-- Quick actions -->
      <div class="props-section">
        <div class="props-section-title">快捷操作</div>
        <button class="quick-action-btn">
          <i data-lucide="copy"></i>
          复制节点
        </button>
        <button class="quick-action-btn">
          <i data-lucide="lock"></i>
          锁定位置
        </button>
        <button class="quick-action-btn">
          <i data-lucide="palette"></i>
          复制样式
        </button>
        <button class="quick-action-btn danger">
          <i data-lucide="trash-2"></i>
          删除节点
        </button>
      </div>
    </aside>

    <!-- ========== PAGE TABS BAR ========== -->
    <footer class="tabs-bar">
      <div class="tab-item active">
        <i data-lucide="file-text"></i>
        <span>Page 1</span>
      </div>
      <div class="tab-item">
        <i data-lucide="file-text"></i>
        <span>Page 2</span>
      </div>
      <button class="tab-add" title="添加页面">
        <i data-lucide="plus"></i>
      </button>
    </footer>

  </div>

  <!-- Initialize Lucide icons -->
  <script>
    lucide.createIcons();
  </script>

    <style>
    /* ===== Global Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh;
      overflow: hidden;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Editor Shell (CSS Grid) ===== */
    .editor-shell {
      display: grid;
      grid-template-rows: 48px 1fr 32px;
      grid-template-columns: 260px 1fr 280px;
      grid-template-areas:
        "toolbar toolbar toolbar"
        "sidebar canvas  props"
        "tabs    tabs   tabs";
      height: 100vh;
      width: 100vw;
    }

    /* ===== Toolbar ===== */
    .toolbar {
      grid-area: toolbar;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 4px;
      z-index: 20;
    }

    .brand-mark {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; color: #fff;
      flex-shrink: 0;
      margin-right: 8px;
    }
    .brand-name {
      font-weight: 600; font-size: 13px; color: var(--text-primary);
      margin-right: 16px; white-space: nowrap;
    }

    .tool-divider {
      width: 1px; height: 24px;
      background: var(--border);
      margin: 0 6px;
      flex-shrink: 0;
    }

    .tool-group {
      display: flex; align-items: center; gap: 2px;
    }

    .tool-btn {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      border: none; background: transparent;
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      cursor: default;
      position: relative;
      transition: background var(--transition-fast);
    }
    .tool-btn:hover {
      background: var(--accent-dim);
      color: var(--text-primary);
    }
    .tool-btn.active {
      background: var(--accent);
      color: var(--text-on-accent);
      box-shadow: 0 0 12px rgba(124, 106, 255, 0.3);
    }
    .tool-btn.danger:hover {
      background: var(--status-danger-dim);
      color: var(--status-danger);
    }
    .tool-btn svg { width: 16px; height: 16px; }

    .toolbar-spacer { flex: 1; }

    .project-title-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 4px 12px 4px 14px;
      font-size: 12px; font-weight: 500;
      font-family: var(--font-mono);
      color: var(--text-primary);
      white-space: nowrap;
    }
    .project-title-pill svg { width: 13px; height: 13px; color: var(--text-muted); }

    .zoom-pill {
      display: flex; align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 2px 4px;
      gap: 0;
      margin-left: 8px;
    }
    .zoom-pill button {
      width: 26px; height: 26px;
      border: none; background: transparent;
      color: var(--text-secondary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: default; font-size: 14px; font-weight: 600;
    }
    .zoom-pill button:hover { background: var(--bg-hover); color: var(--text-primary); }
    .zoom-pill button svg { width: 14px; height: 14px; }
    .zoom-pill .zoom-value {
      font-size: 11px; font-weight: 500;
      color: var(--text-secondary); padding: 0 4px;
      font-family: var(--font-mono);
      min-width: 32px; text-align: center;
    }

    /* ===== Left Sidebar ===== */
    .sidebar {
      grid-area: sidebar;
      background: var(--bg-base);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex; flex-direction: column;
      z-index: 10;
    }

    .sidebar-search {
      padding: 10px 12px 8px;
    }
    .sidebar-search .search-input-wrap {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 6px 10px;
    }
    .sidebar-search .search-input-wrap svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
    .sidebar-search .search-input-wrap input {
      border: none; background: transparent; outline: none;
      font-size: 12px; color: var(--text-primary);
      width: 100%; font-family: var(--font-sans);
    }
    .sidebar-search .search-input-wrap input::placeholder { color: var(--text-muted); }

    .template-card {
      margin: 0 12px 10px;
      padding: 10px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius-md);
      display: flex; align-items: center; gap: 10px;
      cursor: default;
      transition: border-color var(--transition-fast);
    }
    .template-card:hover { border-color: var(--accent-glow); }
    .template-card .tc-icon {
      width: 36px; height: 36px;
      border-radius: var(--radius-sm);
      background: var(--accent-surface);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
    }
    .template-card .tc-icon svg { width: 18px; height: 18px; }
    .template-card .tc-text { font-size: 12px; font-weight: 500; color: var(--text-primary); }
    .template-card .tc-desc { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

    .section-header {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px 6px;
      font-size: 10px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .section-header svg { width: 12px; height: 12px; }

    .shape-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 0 12px 10px;
    }

    .shape-card {
      height: 54px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid transparent;
      border-left: 3px solid var(--border);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
      cursor: default;
      transition: all var(--transition-fast);
      position: relative;
    }
    .shape-card:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
    }
    .shape-card.active {
      border-left-color: var(--accent);
      background: var(--accent-surface);
    }
    .shape-card svg { width: 20px; height: 20px; }
    .shape-card .sc-label { font-size: 10px; color: var(--text-secondary); }
    .shape-card.type-blue   svg { color: var(--status-info); }
    .shape-card.type-green  svg { color: var(--status-success); }
    .shape-card.type-yellow svg { color: var(--status-warning); }
    .shape-card.type-red    svg { color: var(--status-danger); }
    .shape-card.type-purple svg { color: var(--accent); }
    .shape-card.type-blue.active   { border-left-color: var(--status-info); }
    .shape-card.type-green.active  { border-left-color: var(--status-success); }
    .shape-card.type-yellow.active { border-left-color: var(--status-warning); }
    .shape-card.type-red.active    { border-left-color: var(--status-danger); }
    .shape-card.type-purple.active { border-left-color: var(--accent); }

    .layer-list {
      padding: 0 12px 12px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .layer-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px; color: var(--text-secondary);
      cursor: default;
      transition: background var(--transition-fast);
    }
    .layer-item:hover { background: var(--bg-hover); }
    .layer-item.active { background: var(--accent-dim); color: var(--text-primary); }
    .layer-item svg { width: 14px; height: 14px; flex-shrink: 0; }
    .layer-item .layer-name { flex: 1; }
    .layer-item .layer-vis svg { width: 13px; height: 13px; }

    /* ===== Canvas Area ===== */
    .canvas-area {
      grid-area: canvas;
      background: var(--bg-canvas);
      position: relative;
      overflow: hidden;
      /* dot grid */
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Sample flowchart nodes */
    .node {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 500;
      border-radius: var(--radius-md);
      border: 1.5px solid;
      cursor: default;
      white-space: nowrap;
      z-index: 5;
    }
    .node-green {
      background: var(--status-success-dim);
      border-color: rgba(52, 211, 153, 0.4);
      color: var(--status-success);
      border-radius: var(--radius-full);
      box-shadow: 0 0 20px rgba(52, 211, 153, 0.1);
    }
    .node-blue {
      background: var(--status-info-dim);
      border-color: rgba(96, 165, 250, 0.4);
      color: var(--status-info);
      box-shadow: 0 0 20px rgba(96, 165, 250, 0.08);
    }
    .node-yellow {
      background: var(--status-warning-dim);
      border-color: rgba(251, 191, 36, 0.4);
      color: var(--status-warning);
      /* diamond shape via transform */
      border-radius: var(--radius-sm);
      transform: rotate(45deg);
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.08);
    }
    .node-yellow span { transform: rotate(-45deg); }
    .node-red {
      background: var(--status-danger-dim);
      border-color: rgba(248, 113, 113, 0.4);
      color: var(--status-danger);
      border-radius: var(--radius-full);
      box-shadow: 0 0 20px rgba(248, 113, 113, 0.1);
    }
    .node.selected {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-glow) !important;
    }

    /* Connection lines via SVG */
    .connections-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Floating minimap */
    .minimap {
      position: absolute;
      bottom: 48px; right: 12px;
      width: 160px; height: 120px;
      background: rgba(17, 19, 32, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      z-index: 15;
      overflow: hidden;
    }
    .minimap-viewport {
      position: absolute;
      border: 1.5px solid var(--accent);
      border-radius: 3px;
      background: var(--accent-dim);
      top: 20px; left: 30px;
      width: 90px; height: 70px;
    }
    .minimap-dot {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .minimap-dot.mg { background: var(--status-success); top: 25px; left: 45px; }
    .minimap-dot.mb { background: var(--status-info); top: 45px; left: 70px; }
    .minimap-dot.my { background: var(--status-warning); top: 70px; left: 65px; }
    .minimap-dot.mr { background: var(--status-danger); top: 95px; left: 85px; }

    /* Floating zoom pill */
    .canvas-zoom-pill {
      position: absolute;
      bottom: 48px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center;
      background: rgba(17, 19, 32, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 3px;
      z-index: 15;
      gap: 2px;
    }
    .canvas-zoom-pill button {
      width: 28px; height: 28px;
      border: none; background: transparent;
      color: var(--text-secondary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: default;
    }
    .canvas-zoom-pill button:hover { background: var(--bg-hover); color: var(--text-primary); }
    .canvas-zoom-pill button svg { width: 14px; height: 14px; }
    .canvas-zoom-pill .czp-value {
      font-size: 11px; font-weight: 600;
      color: var(--text-primary);
      padding: 0 6px;
      font-family: var(--font-mono);
      min-width: 36px; text-align: center;
    }
    .canvas-zoom-pill .czp-divider {
      width: 1px; height: 18px; background: var(--border);
    }

    /* ===== Properties Panel ===== */
    .props-panel {
      grid-area: props;
      background: var(--bg-base);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      z-index: 10;
      display: flex; flex-direction: column;
    }

    .props-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px; font-weight: 600;
      color: var(--text-primary);
    }
    .props-header svg { width: 14px; height: 14px; color: var(--text-muted); }

    .props-section {
      padding: 10px 14px;
      border-bottom: 1px solid var(--divider);
    }
    .props-section:last-child { border-bottom: none; }

    .props-section-title {
      font-size: 10px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .props-field {
      margin-bottom: 8px;
    }
    .props-field-label {
      font-size: 10px; color: var(--text-muted);
      margin-bottom: 3px;
    }
    .props-field-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 8px;
      font-size: 11px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      outline: none;
    }
    .props-field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .color-swatches {
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .swatch {
      width: 22px; height: 22px;
      border-radius: 4px;
      border: 1.5px solid var(--border);
      cursor: default;
      position: relative;
      transition: border-color var(--transition-fast);
    }
    .swatch:hover { border-color: var(--border-hover); }
    .swatch.active { border-color: var(--text-primary); }
    .swatch.active::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fff;
      mix-blend-mode: difference;
    }

    .slider-row {
      display: flex; align-items: center; gap: 8px;
    }
    .slider-track {
      flex: 1; height: 4px;
      background: var(--bg-elevated);
      border-radius: 2px;
      position: relative;
    }
    .slider-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 40%;
    }
    .slider-thumb {
      width: 12px; height: 12px;
      background: var(--text-primary);
      border-radius: 50%;
      position: absolute;
      top: 50%; left: 40%;
      transform: translate(-50%, -50%);
      box-shadow: var(--shadow-sm);
    }
    .slider-value {
      font-size: 11px; font-family: var(--font-mono);
      color: var(--text-secondary); min-width: 28px; text-align: right;
    }

    .quick-action-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%;
      padding: 7px 0;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 11px; font-weight: 500;
      cursor: default;
      margin-bottom: 4px;
      transition: all var(--transition-fast);
    }
    .quick-action-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }
    .quick-action-btn svg { width: 14px; height: 14px; }
    .quick-action-btn.danger {
      color: var(--status-danger);
      border-color: var(--status-danger-dim);
    }
    .quick-action-btn.danger:hover {
      background: var(--status-danger-dim);
    }

    /* ===== Page Tabs Bar ===== */
    .tabs-bar {
      grid-area: tabs;
      background: var(--bg-base);
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 8px;
      gap: 2px;
      z-index: 20;
    }
    .tab-item {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 14px;
      font-size: 11px; font-weight: 500;
      color: var(--text-muted);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      cursor: default;
      position: relative;
      transition: color var(--transition-fast);
    }
    .tab-item:hover { color: var(--text-secondary); }
    .tab-item.active {
      color: var(--text-primary);
      background: var(--bg-surface);
    }
    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
    }
    .tab-item svg { width: 12px; height: 12px; }
    .tab-add {
      width: 24px; height: 24px;
      border-radius: var(--radius-sm);
      border: none; background: transparent;
      color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      cursor: default;
    }
    .tab-add:hover { background: var(--bg-hover); color: var(--text-secondary); }
    .tab-add svg { width: 14px; height: 14px; }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }
  </style>
</body>
</html>
